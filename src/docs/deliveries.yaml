
paths:
  /api/deliveries:
    get:
      tags:
        - Deliveries
      summary: Obtener todas las entregas
      description: Devuelve las entregas registradas en MongoDB, incluyendo los pedidos y los repartidores asociados.
      responses:
        '200':
          description: Entregas obtenidas correctamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    type: array
                    items:
                      $ref: '#/components/schemas/Delivery'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/deliveries/{id}:
    get:
      tags:
        - Deliveries
      summary: Obtener una entrega por ID
      description: Busca una entrega específica utilizando su identificador de MongoDB.
      parameters:
        - in: path
          name: id
          required: true
          description: Identificador de la entrega.
          schema:
            type: string
          example: "507f191e810c19729de860ea"
      responses:
        '200':
          description: Entrega encontrada correctamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    $ref: '#/components/schemas/Delivery'
        '400':
          description: El identificador proporcionado no es válido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: INVALID_ID
                message: El identificador proporcionado no es válido
        '404':
          description: No se encontró una entrega con ese ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: DELIVERY_NOT_FOUND
                message: Entrega no encontrada
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
