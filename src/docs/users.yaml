
paths:
  /api/users:
    get:
      tags:
        - Users
      summary: Obtener todos los usuarios
      description: Devuelve la lista de usuarios registrados.
      responses:
        '200':
          description: Usuarios obtenidos correctamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Users
      summary: Crear un usuario
      description: Registra un usuario nuevo. No permite crear administradores directamente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUser'
      responses:
        '201':
          description: Usuario creado correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      payload:
                        $ref: '#/components/schemas/User'
        '400':
          description: Datos inválidos o intento de crear un administrador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                datosInvalidos:
                  summary: Datos de usuario inválidos
                  value:
                    status: error
                    code: INVALID_USER_DATA
                    message: Los datos del usuario no son válidos
                administradorProhibido:
                  summary: Creación de administrador no permitida
                  value:
                    status: error
                    code: ADMIN_CREATION_FORBIDDEN
                    message: No es posible crear administradores desde este endpoint
        '409':
          description: El usuario ya existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: USER_ALREADY_EXISTS
                message: Este email ya se encuentra registrado
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/users/{id}:
    parameters:
      - in: path
        name: id
        required: true
        description: Identificador de MongoDB del usuario.
        schema:
          type: string
        example: "507f1f77bcf86cd799439011"

    get:
      tags:
        - Users
      summary: Obtener un usuario por ID
      responses:
        '200':
          description: Usuario encontrado.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      payload:
                        $ref: '#/components/schemas/User'
        '400':
          description: Identificador inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Usuario no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Users
      summary: Actualizar un usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Campos del usuario que se desean actualizar.
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                role:
                  type: string
      responses:
        '200':
          description: Usuario actualizado correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      payload:
                        $ref: '#/components/schemas/User'
        '400':
          description: Identificador o datos inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Usuario no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Users
      summary: Eliminar un usuario
      responses:
        '200':
          description: Usuario eliminado correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      payload:
                        $ref: '#/components/schemas/User'
        '400':
          description: Identificador inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Usuario no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/users/{id}/documents:
    post:
      tags:
        - Users
      summary: Cargar un documento o licencia de conducir
      description: |
        Permite cargar un archivo y asociarlo a un usuario existente
        mediante Multer.

        Tipos de documentos permitidos:
        - user_document
        - driver_license

        Formatos aceptados:
        - PDF
        - JPG
        - JPEG
        - PNG

        Tamaño máximo permitido: 5 MiB (5242880 bytes).

        El archivo se almacena físicamente en la carpeta correspondiente:
        - uploads/documents para documentos de usuario.
        - uploads/licenses para licencias de conducir.

        MongoDB almacena únicamente los metadatos del archivo.
        Los documentos anteriores se conservan.
        Las operaciones exitosas y los errores se registran mediante Winston.

      parameters:
        - in: path
          name: id
          required: true
          description: Identificador de MongoDB del usuario.
          schema:
            type: string
          example: "507f1f77bcf86cd799439011"

      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadUserDocument'
            encoding:
              file:
                contentType: 'application/pdf, image/jpeg, image/png'

      responses:
        '201':
          description: Documento cargado y asociado correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: Documento cargado correctamente
                      payload:
                        $ref: '#/components/schemas/User'
              example:
                status: success
                message: Documento cargado correctamente
                payload:
                  _id: "507f1f77bcf86cd799439011"
                  firstName: Juan
                  lastName: Pérez
                  email: juan@example.com
                  role: customer
                  documents:
                    - _id: "507f1f77bcf86cd799439012"
                      originalName: documento.png
                      fileName: "08b5eb3f-22c9-4423-98b9-755a24d1b538.png"
                      path: "documents/08b5eb3f-22c9-4423-98b9-755a24d1b538.png"
                      mimeType: image/png
                      size: 47001
                      documentType: user_document
                      uploadedAt: "2026-11-24T12:15:41.648Z"

        '400':
          description: Solicitud inválida o datos de carga incorrectos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                archivoFaltante:
                  summary: No se adjuntó ningún archivo
                  value:
                    status: error
                    code: FILE_REQUIRED
                    message: Es obligatorio adjuntar un archivo
                tipoDocumentoInvalido:
                  summary: Tipo de documento no permitido
                  value:
                    status: error
                    code: INVALID_DOCUMENT_TYPE
                    message: El tipo de documento proporcionado no es válido
                campoIncorrecto:
                  summary: Nombre de campo de archivo incorrecto
                  value:
                    status: error
                    code: INVALID_FILE_FIELD
                    message: El campo utilizado para cargar el archivo no es válido
                multipartInvalido:
                  summary: Datos multipart incorrectos
                  value:
                    status: error
                    code: INVALID_MULTIPART_DATA
                    message: Los datos de carga multipart/form-data no son válidos
                identificadorInvalido:
                  summary: Identificador de usuario inválido
                  value:
                    status: error
                    code: INVALID_ID
                    message: El identificador proporcionado no es válido

        '404':
          description: El usuario indicado no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: USER_NOT_FOUND
                message: Usuario no encontrado

        '413':
          description: El archivo supera el límite de 5 MiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: FILE_TOO_LARGE
                message: El archivo supera el tamaño máximo permitido

        '415':
          description: El formato del archivo no está permitido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: INVALID_FILE_TYPE
                message: El tipo de archivo no está permitido

        '500':
          description: Error durante el almacenamiento o procesamiento del archivo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                errorAlmacenamiento:
                  summary: Error al guardar el archivo
                  value:
                    status: error
                    code: FILE_UPLOAD_ERROR
                    message: Ocurrió un error al guardar el archivo
                errorInterno:
                  summary: Error interno del servidor
                  value:
                    status: error
                    code: INTERNAL_ERROR
                    message: Error interno del servidor
