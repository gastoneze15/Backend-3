
paths:
  /api/logger/test:
    get:
      tags:
        - Logger
      summary: Probar los niveles de logging
      description: >
        Endpoint de diagnóstico para validar el funcionamiento
        de Winston. Genera mensajes en los niveles debug, http,
        info, warning, error y fatal.

        Es una herramienta de validación técnica y no forma
        parte de las funcionalidades de negocio de ShipNow.

        Solo está disponible cuando NODE_ENV es development o test.
        En desarrollo se muestran los seis niveles de logging.
        En testing se aplica el nivel info.

      responses:
        '200':
          description: Prueba de logging ejecutada correctamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Prueba de logging ejecutada correctamente
                  levels:
                    type: array
                    items:
                      type: string
                    example:
                      - debug
                      - http
                      - info
                      - warning
                      - error
                      - fatal

        '403':
          description: Endpoint no disponible fuera de desarrollo y testing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: LOGGER_NOT_ALLOWED
                message: La prueba de logging solo está disponible en desarrollo y testing

        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: INTERNAL_ERROR
                message: Error interno del servidor
