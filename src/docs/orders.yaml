
paths:
  /api/orders:
    get:
      tags:
        - Orders
      summary: Obtener todos los pedidos
      description: Devuelve los pedidos registrados en MongoDB, incluyendo los datos básicos de sus clientes y las entregas asociadas.
      responses:
        '200':
          description: Pedidos obtenidos correctamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Orders
      summary: Crear un nuevo pedido
      description: Crea un pedido para un cliente existente y calcula automáticamente el total de sus productos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer
                - items
                - deliveryAddress
              properties:
                customer:
                  type: string
                  description: ID del cliente en MongoDB.
                  example: "507f1f77bcf86cd799439011"
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - name
                      - quantity
                      - price
                    properties:
                      name:
                        type: string
                        example: Producto de prueba
                      quantity:
                        type: integer
                        minimum: 1
                        example: 2
                      price:
                        type: number
                        minimum: 0
                        example: 1500
                deliveryAddress:
                  type: string
                  example: Av. Corrientes 1234
      responses:
        '201':
          description: Pedido creado correctamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    $ref: '#/components/schemas/Order'
        '400':
          description: Datos del pedido inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: INVALID_DATA
                message: Los datos proporcionados no son válidos
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/orders/{id}:
    get:
      tags:
        - Orders
      summary: Obtener un pedido por ID
      description: Busca un pedido específico utilizando su identificador de MongoDB.
      parameters:
        - in: path
          name: id
          required: true
          description: Identificador del pedido.
          schema:
            type: string
          example: "507f1f77bcf86cd799439011"
      responses:
        '200':
          description: Pedido encontrado correctamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    $ref: '#/components/schemas/Order'
        '400':
          description: El identificador proporcionado no es válido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: INVALID_ID
                message: El identificador proporcionado no es válido
        '404':
          description: No se encontró un pedido con ese ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: ORDER_NOT_FOUND
                message: Pedido no encontrado
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/orders/{id}/status:
    patch:
      tags:
        - Orders
      summary: Actualizar el estado de un pedido
      description: Actualiza el estado de un pedido existente utilizando uno de los estados permitidos.
      parameters:
        - in: path
          name: id
          required: true
          description: Identificador del pedido.
          schema:
            type: string
          example: "507f1f77bcf86cd799439011"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  description: Nuevo estado del pedido.
                  enum:
                    - created
                    - assigned
                    - picked_up
                    - in_transit
                    - delivered
                    - cancelled
                  example: assigned
      responses:
        '200':
          description: Estado actualizado correctamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    $ref: '#/components/schemas/Order'
        '400':
          description: ID o estado inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidId:
                  summary: ID inválido
                  value:
                    status: error
                    code: INVALID_ID
                    message: El identificador proporcionado no es válido
                invalidStatus:
                  summary: Estado inválido
                  value:
                    status: error
                    code: INVALID_ORDER_STATUS
                    message: El estado del pedido no es válido
        '404':
          description: Pedido no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: ORDER_NOT_FOUND
                message: Pedido no encontrado
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
